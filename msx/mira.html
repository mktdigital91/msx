<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gold Play</title>
<style type="text/css">body { background: #000; color: #fff; font-family: sans-serif; }</style>
<script type="text/javascript" src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
<script type="text/javascript">
/* Plugin de início do Mira (ES5).
 * 1) descobre o ID do aparelho e pede a tela inicial ao servidor;
 * 2) se ainda não há login, espera o pareamento pelo celular e entra sozinho. */
(function () {
  var SERVIDOR = 'https://tmaqxzqswtaejvxkqgfg.supabase.co/functions/v1/mira';
  var idAparelho = '';
  var espera = null;

  function falha(msg) {
    return { type: 'list', headline: 'Gold Play', template: { type: 'separate', layout: '0,0,12,1', color: 'msx-glass' },
      items: [{ title: msg, action: 'none', color: 'msx-red' }] };
  }
  function pedir(url, ok, erro) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 25000;
    x.onload = function () { try { ok(JSON.parse(x.responseText)); } catch (e) { erro(); } };
    x.onerror = erro;
    x.ontimeout = erro;
    x.send();
  }
  var PLUGIN = 'https://mktdigital91.github.io/msx/msx/mira.html';

  // Servidores que não deixam o Supabase falar com eles: o servidor pede, a TV busca no provedor
  // e devolve o texto; o servidor então monta a tela. Até 4 idas e voltas por tela.
  function buscarNaTV(url, cb) {
    var x = new XMLHttpRequest(), feito = false;
    function fim(t) { if (!feito) { feito = true; cb(t); } }
    try {
      x.open('GET', url, true);
      x.timeout = 12000;
      x.onload = function () { fim(x.status >= 200 && x.status < 300 ? (x.responseText || '') : null); };
      x.onerror = function () { fim(null); };
      x.ontimeout = function () { fim(null); };
      x.send();
    } catch (e) { fim(null); }
  }
  function pedirRelay(qs, rel, rodada, ok, erro) {
    var url = SERVIDOR + '?' + qs;
    var x = new XMLHttpRequest();
    x.open(rel ? 'POST' : 'GET', url, true);
    x.timeout = 30000;
    x.onload = function () {
      var r;
      try { r = JSON.parse(x.responseText); } catch (e) { erro(); return; }
      if (r && r.__relay && rodada < 4) {
        var urls = r.__relay, falta = urls.length, novo = rel || {}, prox = 0;
        if (!falta) { erro(); return; }
        // no máximo 8 buscas ao mesmo tempo na TV
        var vez = function () {
          if (prox >= urls.length) { return; }
          var u = urls[prox++];
          buscarNaTV(u, function (t) {
            novo[u] = t;
            falta--;
            if (falta === 0) { pedirRelay(qs, novo, rodada + 1, ok, erro); } else { vez(); }
          });
        };
        for (var k = 0; k < 8 && k < urls.length; k++) { vez(); }
        return;
      }
      ok(r);
    };
    x.onerror = erro;
    x.ontimeout = erro;
    if (rel) { x.setRequestHeader('Content-Type', 'text/plain'); x.send(JSON.stringify({ rel: rel })); } else { x.send(); }
  }
  function paraEspera() { if (espera) { clearInterval(espera); espera = null; } }

  // Enquanto a tela de login estiver aberta, pergunta ao servidor se o celular já fez o login.
  function aguardarPareamento(id) {
    paraEspera();
    var tentativas = 0;
    espera = setInterval(function () {
      tentativas++;
      if (tentativas > 200) { paraEspera(); return; }   // ~10 min
      pedir(SERVIDOR + '?a=ver&d=' + encodeURIComponent(id), function (r) {
        if (r && r.ok) {
          paraEspera();
          try { TVXInteractionPlugin.executeAction('content:request:interaction:a=inicio&d=' + encodeURIComponent(id) + '&rl=1@' + PLUGIN); } catch (e) { }
        }
      }, function () { });
    }, 3000);
  }

  function abrir(id, callback, acao) {
    idAparelho = id;
    pedirRelay('a=' + (acao || 'inicio') + '&d=' + encodeURIComponent(id) + '&rl=1', null, 0, function (tela) {
      callback(tela);
      // tela de login (traz o item do QR code) => fica esperando o celular
      var texto = ''; try { texto = JSON.stringify(tela); } catch (e) { }
      if (texto.indexOf('"id":"qr"') >= 0) { aguardarPareamento(id); }
    }, function () { callback(falha('Sem conexão com o servidor')); });
  }

  function MiraHandler() {
    this.init = function () { };
    this.ready = function () { };
    this.handleEvent = function () { };
    this.handleData = function () { };
    this.handleRequest = function (dataId, data, callback) {
      // qualquer outro id é uma tela do app (texto da consulta): passa pelo relay
      if (dataId !== 'init' && dataId !== 'sair') {
        if (!dataId) { callback(null); return; }
        var qs = String(dataId); if (qs.indexOf('rl=1') < 0) { qs += '&rl=1'; }
        pedirRelay(qs, null, 0, function (tela) { callback(tela); }, function () { callback(falha('Sem conexão com o servidor')); });
        return;
      }
      var feito = false;
      function seguir(id) { if (feito) return; feito = true; abrir(id || 'sem-id', callback, dataId === 'sair' ? 'sair' : 'inicio'); }
      try {
        TVXInteractionPlugin.requestDeviceId(function (id) {
          seguir(typeof id === 'string' && id ? id : (TVXSettings.ID || ''));
        });
      } catch (e) { seguir(TVXSettings.ID || ''); }
      setTimeout(function () { seguir(TVXSettings.ID || ''); }, 4000);
    };
  }

  TVXPluginTools.onReady(function () {
    TVXInteractionPlugin.setupHandler(new MiraHandler());
    TVXInteractionPlugin.init();
  });
})();
</script>
</head>
<body></body>
</html>
