<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gold Play Player</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
  #aviso { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none;
    background: radial-gradient(circle at 30% 20%, rgba(124,92,255,.35), rgba(5,5,16,.92) 60%); }
  #cartao { position: absolute; left: 50%; top: 50%; width: 760px; margin-left: -380px; margin-top: -130px; padding: 40px 48px;
    box-sizing: border-box; border-radius: 28px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); color: #fff; text-align: center; }
  #cartao .ico { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; background: linear-gradient(135deg,#F59E0B,#F43F5E);
    font-size: 44px; line-height: 72px; font-weight: 800; }
  #cartao h1 { margin: 0 0 10px; font-size: 34px; font-weight: 700; }
  #cartao p { margin: 0; font-size: 24px; color: rgba(255,255,255,.75); }
  /* carregando: logo Gold Play com anel dourado girando */
  #carregando { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -95px 0 0 -75px; display: none; }
  #carregando .anel { position: absolute; left: 0; top: 0; width: 150px; height: 150px; box-sizing: border-box; border-radius: 50%;
    border: 4px solid rgba(214,178,94,.15); border-top-color: #F0D696; border-right-color: #D6B25E; -webkit-animation: gira 1.1s linear infinite; animation: gira 1.1s linear infinite; }
  #carregando img { position: absolute; left: 30px; top: 30px; width: 90px; height: 90px; object-fit: contain; -webkit-animation: pulsa 1.6s ease-in-out infinite; animation: pulsa 1.6s ease-in-out infinite; }
  #carregando span { position: absolute; left: -60px; right: -60px; top: 168px; text-align: center; color: rgba(255,255,255,.8); font-size: 22px; letter-spacing: .08em; }
  @-webkit-keyframes pulsa { 50% { opacity: .55; -webkit-transform: scale(.94); } }
  @keyframes pulsa { 50% { opacity: .55; transform: scale(.94); } }
  @-webkit-keyframes gira { to { -webkit-transform: rotate(360deg); } }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<video id="v" autoplay></video>
<div id="carregando"><div class="anel"></div><img src="img/logo-goldplay.png" alt=""><span>Carregando…</span></div>
<div id="dbg" style="position:absolute;left:8px;bottom:8px;max-width:92%;z-index:9;display:none;padding:4px 8px;background:rgba(0,0,0,.6);color:#9f9;font:14px/18px monospace;white-space:pre-wrap"></div>
<div id="aviso"><div id="cartao"><div class="ico">!</div><h1 id="titulo">Não foi possível reproduzir</h1><p>Tente novamente em instantes.</p><p id="det" style="margin-top:14px;font-size:18px;color:rgba(255,255,255,.45)"></p></div></div>
<script src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
<script>
// Player próprio do Mira (ES5): esconde o endereço do vídeo e mostra erros em português.
(function () {
  function param(nome) {
    var m = new RegExp("[?&]" + nome + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  function decodificar(s) {
    try {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return atob(s).split("\n");
    } catch (e) { return []; }
  }
  var fontes = (param("f") ? decodificar(param("f")) : [param("u"), param("alt")]).filter(function (x) { return !!x; });
  // canais ao vivo: .m3u8 (HLS) primeiro, oscila menos; .ts fica de reserva
  fontes.sort(function (a, b) { return (/\.m3u8/.test(b) ? 1 : 0) - (/\.m3u8/.test(a) ? 1 : 0); });
  var tipo = param("m") || "o canal";
  var ehVod = tipo !== "o canal"; // filme ou episódio: tem começo, fim e posição para continuar
  // registro do que está sendo assistido (Continuar assistindo / Últimos canais): endereço vem codificado em "h"
  var registro = param("h") ? (decodificar(param("h"))[0] || "") : "";
  var regUltimo = 0, regLive = false;
  function registrar(forcar) {
    if (!registro || falhou) return;
    var agora = new Date().getTime();
    if (!forcar && agora - regUltimo < 60000) return;
    var pos = Math.floor(v.currentTime || 0), dur = isFinite(v.duration) ? Math.floor(v.duration) : 0;
    if (ehVod && pos < 5) return;
    regUltimo = agora;
    try { var x = new XMLHttpRequest(); x.open("GET", registro + "&pos=" + pos + "&dur=" + dur, true); x.timeout = 10000; x.send(); } catch (e) {}
  }
  var posPendente = -1; // posição pedida antes de o vídeo carregar (continuar de onde parou / reconexão)
  function aplicarPendente() {
    if (posPendente < 0 || v.readyState < 1) return;
    var s = posPendente; posPendente = -1;
    if (isFinite(v.duration) && v.duration > 0 && s > v.duration - 5) s = Math.max(0, v.duration - 5);
    try { v.currentTime = s; } catch (e) {}
  }
  var v = document.getElementById("v");
  var aviso = document.getElementById("aviso");
  var carregando = document.getElementById("carregando");
  var atual = 0, vigia = null, falhou = false;
  // Android (celular/tablet): o WebView toca HLS mal, então usa hls.js; TVs e iPhone seguem no player nativo
  var ua = navigator.userAgent || "";
  var usaHls = /Android/i.test(ua) && !/Web0S|webOS|Tizen|SMART-TV|SmartTV/i.test(ua);
  var hls = null, hlsTent = 0;
  function carregarHls(cb) {
    if (!usaHls || window.Hls) { cb(); return; }
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";
    sc.onload = function () { cb(); };
    sc.onerror = function () { cb(); };
    document.getElementsByTagName("head")[0].appendChild(sc);
  }
  function soltarHls() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }
  var dg = { frags: 0, anexos: 0, avisos: "", codecs: "", manif: 0, host: "" };
  function so_host(u) { var m = /^[a-z]+:\/\/([^\/?#]+)/i.exec(u || ""); return m ? m[1] : ""; }
  function dbgAtualizar() {
    var el = document.getElementById("dbg");
    if (!el || !usaHls) return;
    var b = "-";
    try { if (v.buffered && v.buffered.length) b = v.buffered.start(0).toFixed(1) + "-" + v.buffered.end(v.buffered.length - 1).toFixed(1); } catch (e) {}
    el.style.display = "block";
    el.innerHTML = (hls ? "hls" : "nativo") + " rs=" + v.readyState + " t=" + (v.currentTime || 0).toFixed(1) + " buf=" + b +
      " frags=" + dg.frags + " anexos=" + dg.anexos + " vid=" + v.videoWidth + "x" + v.videoHeight + (v.error ? " err=" + v.error.code : "") +
      "\n" + (dg.codecs || (dg.manif ? "manifesto: aguardando " + Math.round((new Date().getTime() - dg.manif) / 1000) + "s" : "")) + (dg.host ? " host=" + dg.host : "") + (dg.avisos ? "\n" + dg.avisos : "");
  }
  setInterval(dbgAtualizar, 1000);
  function detalhe(t) { var d = document.getElementById("det"); if (d) d.innerHTML = t || ""; }

  document.getElementById("titulo").innerHTML = "Não foi possível reproduzir " + tipo;

  function mostrarCarregando(sim) { carregando.style.display = sim ? "block" : "none"; }
  function erroFinal() {
    falhou = true;
    clearTimeout(vigia);
    mostrarCarregando(false);
    soltarHls();
    try { v.removeAttribute("src"); v.load(); } catch (e) {}
    aviso.style.display = "block";
  }
  function tentar(i) {
    clearTimeout(vigia);
    if (i >= fontes.length) { erroFinal(); return; }
    if (ehVod && posPendente < 0 && (v.currentTime || 0) > 5) posPendente = v.currentTime;
    atual = i; ult = -1; parado = 0;
    mostrarCarregando(true);
    soltarHls();
    if (usaHls && window.Hls && Hls.isSupported() && /\.m3u8/.test(fontes[i])) {
      hlsTent = 0;
      hls = new Hls({ lowLatencyMode: false, maxBufferLength: 30, manifestLoadingTimeOut: 8000, manifestLoadingMaxRetry: 1, manifestLoadingRetryDelay: 500, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3 });
      dg.frags = 0; dg.anexos = 0; dg.avisos = ""; dg.codecs = ""; dg.manif = 0; dg.host = "";
      hls.on(Hls.Events.MANIFEST_LOADING, function () { dg.manif = new Date().getTime(); });
      hls.on(Hls.Events.MANIFEST_LOADED, function (ev, d) { try { dg.host = so_host((d.networkDetails && d.networkDetails.responseURL) || d.url); } catch (e) {} });
      hls.on(Hls.Events.MANIFEST_PARSED, function (ev, d) {
        try { var l = d.levels[0]; dg.codecs = "codec v=" + (l.videoCodec || "?") + " a=" + (l.audioCodec || "?") + " " + (l.width || 0) + "x" + (l.height || 0) + " niveis=" + d.levels.length; } catch (e) {}
      });
      hls.on(Hls.Events.FRAG_LOADED, function () { dg.frags++; });
      hls.on(Hls.Events.BUFFER_APPENDED, function () { dg.anexos++; });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (d && !d.fatal) { dg.avisos = "aviso: " + d.details + (d.response && d.response.code !== undefined ? " " + d.response.code : ""); }
        if (!d || !d.fatal) return;
        dg.avisos = "FATAL: " + d.details + (d.response && d.response.code !== undefined ? " " + d.response.code : "");
        detalhe("hls: " + d.type + " / " + d.details + (d.response && d.response.code !== undefined ? " / " + d.response.code : ""));
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && hlsTent < 2) { hlsTent++; try { hls.startLoad(); } catch (e) {} return; }
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR && hlsTent < 2) { hlsTent++; try { hls.recoverMediaError(); } catch (e) {} return; }
        tentar(atual + 1);
      });
      hls.loadSource(fontes[i]);
      hls.attachMedia(v);
    } else {
      v.src = fontes[i];
      try { v.load(); } catch (e) {}
    }
    var p = v.play();
    if (p && p["catch"]) p["catch"](function () {});
    // se em 20 s não começar a tocar, tenta a próxima fonte
    vigia = setTimeout(function () { tentar(atual + 1); }, 20000);
  }
  // vigia de travamento: se o tempo do vídeo não andar por 8 s, reabre a mesma fonte; depois de 2 falhas seguidas, troca de formato
  var ult = -1, parado = 0, refeitos = 0, pausado = false;
  function reconectar() {
    if (falhou || pausado || !v.src) return;
    parado = 0; refeitos++;
    fecharTravada("reconexao");
    if (refeitos > 2 && fontes.length > 1) { refeitos = 0; tentar((atual + 1) % fontes.length); return; }
    tentar(atual);
  }
  setInterval(function () {
    if (falhou || pausado || !v.src) return;
    var t = v.currentTime || 0;
    if (t !== ult) { ult = t; parado = 0; if (!v.paused) { refeitos = 0; mostrarCarregando(false); } return; }
    if (v.ended) return; // terminou: não é travamento
    if (v.paused) { try { v.play(); } catch (e) {} }
    parado += 2;
    if (parado >= 4) iniciarTravada(parado * 1000);
    if (parado >= 8) { mostrarCarregando(true); reconectar(); }
  }, 2000);
  v.addEventListener("playing", function () {
    clearTimeout(vigia); mostrarCarregando(false);
    if (!ehVod && !regLive) { regLive = true; setTimeout(function () { if (!v.paused) registrar(true); }, 8000); } // canal: conta depois de 8 s
  });
  setInterval(function () { if (ehVod && !v.paused) registrar(false); }, 15000); // filme/episódio: guarda a posição a cada minuto
  v.addEventListener("canplay", function () { if (!v.paused) mostrarCarregando(false); });
  v.addEventListener("timeupdate", function () { if (!falhou && !v.paused && v.currentTime > 0 && !v.seeking) { clearTimeout(vigia); mostrarCarregando(false); } });
  v.addEventListener("loadedmetadata", aplicarPendente);
  v.addEventListener("canplay", aplicarPendente);
  // canal ao vivo que "termina" caiu: reconecta. Filme/episódio que termina: fica no fim.
  v.addEventListener("ended", function () {
    if (falhou) return;
    if (!ehVod) { if (fontes.length) reconectar(); return; }
    // filme/episódio terminou: guarda como visto e avisa o MSX (que então pode tocar o próximo episódio)
    registrar(true);
    try { TVXVideoPlugin.setEnded(true, true); } catch (e) {}
  });
  v.addEventListener("waiting", function () { if (!falhou) mostrarCarregando(true); });
  v.addEventListener("error", function () { if (!falhou) tentar(atual + 1); });

  // ---- telemetria de qualidade: mede travadas na TV e manda ao Mira (a=tel) para diagnosticar onde está o problema ----
  var tl = param("tl"), usr = param("usr"), canalNome = param("c");
  var tel = { t0: new Date().getTime(), tocou: false, stall: 0, ct: null, pv: null, env: 0, dp0: 0, tt0: 0, aberta: null };
  function agora() { return new Date().getTime(); }
  function qualidade() {
    var d = 0, t = 0;
    try {
      if (v.getVideoPlaybackQuality) { var q = v.getVideoPlaybackQuality(); d = q.droppedVideoFrames || 0; t = q.totalVideoFrames || 0; }
      else { d = v.webkitDroppedFrameCount || 0; t = v.webkitDecodedFrameCount || 0; }
    } catch (e) {}
    var r = { dp: Math.max(0, d - tel.dp0), tt: Math.max(0, t - tel.tt0) };
    tel.dp0 = d; tel.tt0 = t;
    return r;
  }
  function enviar(o) {
    if (!tl || !usr || tel.env > 400) return;
    tel.env++;
    var qs = "a=tel&usr=" + encodeURIComponent(usr) + "&h=" + encodeURIComponent(so_host(fontes[atual] || fontes[0] || "")) + "&c=" + encodeURIComponent(canalNome);
    for (var k in o) { if (o.hasOwnProperty(k) && o[k] !== null && o[k] !== undefined) qs += "&" + k + "=" + encodeURIComponent(o[k]); }
    try { var x = new XMLHttpRequest(); x.open("GET", tl + (tl.indexOf("?") < 0 ? "?" : "&") + qs); x.send(); } catch (e) {}
  }
  // tempo até o endereço responder (mesmo erro de CORS conta como "respondeu"); -1 = sem resposta em 8 s
  function medir(url, cb) {
    var t0 = agora(), feito = false, x = new XMLHttpRequest();
    function fim(sem) { if (feito) return; feito = true; cb(sem ? -1 : agora() - t0); }
    try {
      x.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "_=" + t0);
      x.timeout = 8000;
      x.onload = function () { fim(false); };
      x.onerror = function () { fim(false); };
      x.ontimeout = function () { fim(true); };
      x.send();
    } catch (e) { fim(true); }
  }
  function sondar() {
    tel.ct = null; tel.pv = null;
    if (!tl) return;
    medir(tl + (tl.indexOf("?") < 0 ? "?" : "&") + "a=ping", function (ms) { tel.ct = ms; });
    var f = fontes[atual] || fontes[0] || "";
    var m = /^([a-z]+:\/\/[^\/?#]+)/i.exec(f);
    if (m) medir(m[1] + "/", function (ms) { tel.pv = ms; }); else tel.pv = -2;
  }
  function aguardarSondas(cb, ate) {
    var n = 0;
    (function espera() {
      if ((tel.ct !== null && tel.pv !== null) || n++ > (ate || 45)) { cb(); return; }
      setTimeout(espera, 200);
    })();
  }
  function iniciarTravada(atraso) {
    if (tel.stall || !tel.tocou || pausado || falhou) return;
    tel.stall = agora() - (atraso || 0);
    sondar();
  }
  function fecharTravada(motivo) {
    if (!tel.stall) return;
    var dur = agora() - tel.stall; tel.stall = 0;
    if (dur < 1500 && !motivo) return;
    var qa = qualidade();
    aguardarSondas(function () {
      enviar({ e: motivo || "travada", dur: dur, ct: tel.ct, pv: tel.pv === -2 ? null : tel.pv, dp: qa.dp, tt: qa.tt, d: motivo ? motivo : "" });
    });
  }
  function eventoPontual(e, det) {
    var qa = qualidade();
    sondar();
    aguardarSondas(function () { enviar({ e: e, ct: tel.ct, pv: tel.pv === -2 ? null : tel.pv, dp: qa.dp, tt: qa.tt, d: det || "" }); });
  }
  v.addEventListener("playing", function () {
    if (!tel.tocou) { tel.tocou = true; enviar({ e: "inicio", dur: agora() - tel.t0 }); }
    fecharTravada();
  });
  v.addEventListener("timeupdate", function () { if (tel.stall && !v.paused && !v.seeking) fecharTravada(); });
  v.addEventListener("waiting", function () { if (!v.seeking) iniciarTravada(0); });
  v.addEventListener("stalled", function () { iniciarTravada(0); });
  v.addEventListener("error", function () { var c = v.error ? v.error.code : 0; eventoPontual("erro", "midia" + c); });
  // amostra a cada minuto enquanto assiste: dá a linha de base (rede e provedor normais) para comparar com as travadas
  setInterval(function () {
    if (!tel.tocou || pausado || falhou || v.paused || tel.stall) return;
    var qa = qualidade();
    sondar();
    aguardarSondas(function () { enviar({ e: "amostra", ct: tel.ct, pv: tel.pv === -2 ? null : tel.pv, dp: qa.dp, tt: qa.tt }); });
  }, 60000);

  function Player() {
    this.init = function () {};
    this.ready = function () { TVXVideoPlugin.startPlayback(); };
    this.play = function () {
      if (falhou) return;
      pausado = false; parado = 0;
      if (!v.src) { carregarHls(function () { tentar(0); }); return; }
      var p = v.play(); if (p && p["catch"]) p["catch"](function () {});
    };
    this.pause = function () { pausado = true; try { v.pause(); } catch (e) {} if (ehVod) registrar(true); };
    this.stop = function () { if (ehVod) registrar(true); pausado = true; clearTimeout(vigia); soltarHls(); try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} };
    this.getDuration = function () { return isFinite(v.duration) ? v.duration : 0; };
    this.getPosition = function () { return v.currentTime || 0; };
    this.setPosition = function (s) {
      s = Number(s) || 0;
      if (v.readyState < 1) { posPendente = s; return; } // ainda carregando: aplica quando o vídeo abrir
      try { v.currentTime = s; } catch (e) {}
    };
    this.setVolume = function (n) { v.volume = Math.max(0, Math.min(1, n / 100)); };
    this.getVolume = function () { return Math.round(v.volume * 100); };
    this.setMuted = function (m) { v.muted = !!m; };
    this.isMuted = function () { return v.muted; };
    this.getSpeed = function () { return v.playbackRate || 1; };
    this.setSpeed = function (s) { try { v.playbackRate = s; } catch (e) {} };
    this.getUpdateData = function () {
      return { position: this.getPosition(), duration: this.getDuration(), speed: this.getSpeed() };
    };
  }

  if (window.TVXPluginTools && window.TVXVideoPlugin) {
    TVXPluginTools.onReady(function () {
      TVXVideoPlugin.setupPlayer(new Player());
      TVXVideoPlugin.init();
    });
  } else {
    carregarHls(function () { tentar(0); }); // fora do MSX (teste no navegador)
  }
})();
</script>
</body>
</html>
