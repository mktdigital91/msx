<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gold Play - teste direto</title>
<style type="text/css">body { background: #000; color: #fff; font-family: sans-serif; }</style>
<script type="text/javascript" src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
<script type="text/javascript">
/*
 * Teste: a TV consegue falar direto com um provedor que bloqueia o servidor (Supabase)?
 * Sem usuário nem senha: só mede se a resposta chega e se o navegador da TV pode lê-la (CORS).
 * ES5 de propósito.
 */
(function () {
  var HOSTS = ['itsnotahat.net', 'horizonmult.site'];
  var URLS = [];
  for (var h = 0; h < HOSTS.length; h++) {
    URLS.push('http://' + HOSTS[h] + '/player_api.php');
    URLS.push('http://' + HOSTS[h] + ':8080/player_api.php');
    URLS.push('https://' + HOSTS[h] + '/player_api.php');
  }

  function xhrGet(url, cb) {
    var t0 = new Date().getTime(), done = false;
    function end(r) { if (done) { return; } done = true; r.ms = new Date().getTime() - t0; cb(r); }
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.timeout = 8000;
      x.onload = function () { end({ ok: true, status: x.status, text: (x.responseText || '').replace(/\s+/g, ' ').slice(0, 70) }); };
      x.onerror = function () { end({ ok: false, why: 'bloqueado (CORS, http em página https ou sem resposta)' }); };
      x.ontimeout = function () { end({ ok: false, why: 'tempo esgotado' }); };
      x.send();
    } catch (e) { end({ ok: false, why: 'erro: ' + e }); }
  }

  function runTests(done) {
    var lines = ['Página aberta por: ' + location.protocol.replace(':', '')];
    var pending = URLS.length;
    for (var i = 0; i < URLS.length; i++) {
      (function (u) {
        xhrGet(u, function (r) {
          var short = u.replace('/player_api.php', '');
          lines.push(r.ok ? short + ' -> LEU: HTTP ' + r.status + ' ' + r.text + ' (' + r.ms + ' ms)'
                          : short + ' -> NÃO: ' + r.why + ' (' + r.ms + ' ms)');
          pending--;
          if (pending === 0) { lines.sort(); done(lines); }
        });
      })(URLS[i]);
    }
  }

  function page(lines) {
    var items = [];
    for (var i = 0; i < lines.length; i++) { items.push({ title: lines[i], action: 'none' }); }
    return {
      type: 'list',
      headline: 'Gold Play - teste direto v2',
      template: { type: 'separate', layout: '0,0,12,1', color: 'msx-glass' },
      items: items
    };
  }

  function H() {
    this.init = function () { };
    this.ready = function () { };
    this.handleEvent = function () { };
    this.handleData = function () { };
    this.handleRequest = function (id, data, cb) {
      if (id === 'init') {
        var sent = false;
        var send = function (l) { if (sent) { return; } sent = true; cb(page(l)); };
        runTests(send);
        setTimeout(function () { send(['Tempo esgotado: nenhum teste respondeu']); }, 15000);
      }
      else { cb(null); }
    };
  }
  TVXPluginTools.onReady(function () { TVXInteractionPlugin.setupHandler(new H()); TVXInteractionPlugin.init(); });
})();
</script>
</head>
<body><h1>Gold Play - teste direto</h1></body>
</html>
